<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalLens</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="app-header">
        <div class="logo">SignalLens</div>
        <div id="market-status" class="market-status">
            <span id="nifty-text">NIFTY 50 --</span>
            <span id="demo-badge" class="badge badge-demo">Demo</span>
        </div>
    </header>

    <main class="container">

        <section class="health-section" style="margin-top:20px;">
            <div id="watchlist-health" class="watchlist-health">
                <!-- Health injected here -->
            </div>
        </section>

        <section class="attention-section">
            <div class="section-header">
                <h2>While You Were Away</h2>
                <div>
                    <button id="filter-attention-btn" class="btn btn-secondary">Filter: All Meaningful</button>
                    <button id="review-all-btn" class="btn btn-secondary" style="margin-left:5px;">Mark All
                        Reviewed</button>
                </div>
            </div>

            <div id="attention-queue" class="attention-grid">
                <!-- Cards injected here -->
            </div>
        </section>

        <section class="watchlist-section" style="margin-top: 50px;">
            <div class="section-header">
                <h2>Watchlist</h2>
                <button id="add-stock-btn" class="btn btn-primary">+ Add Stock</button>
            </div>

            <div class="table-container">
                <table id="watchlist-table">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Status</th>
                            <th>Price</th>
                            <th>Since Baseline</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="watchlist-body">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Stock</h3>
                <span class="close-btn">&times;</span>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search by name or symbol...">
                <button id="search-btn" class="btn btn-secondary">Search</button>
            </div>
            <div id="search-results" class="search-results"></div>
        </div>
    </div>

    <!-- Stock Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="detail-title">Stock Detail</h3>
                <span class="close-detail-btn">&times;</span>
            </div>
            <div id="detail-body">
                <!-- Details injected here -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
</body>

</html>
